- id: EQ-41
  section: 3
  page: 8
  kind: step
  says: Squared speed of the n-th mass as a double sum over the rods.
  status: misprint
  problem: The middle side is printed \vec{R_n}\cdot\vec{R_n}, the squared position, which is not
    |\dot{\vec{R_n}}|^2; the outer equality |\dot{\vec{R_n}}|^2=\sum_{i,j=1}^{n} l_il_j\dot{\theta_i}\dot{\theta_j}\cos(\theta_i-\theta_j)
    is right.
  corrected: |-
    |{\dot{\vec{R_n}}}|^{2}=\dot{\vec{R_n}}\cdot\dot{\vec{R_n}}=\sum_{i,j=1}^{n} l_il_j\dot{\theta_i}\dot{\theta_j}\cos(\theta_i-\theta_j)
  test: symbolic/test_sections_2_3.py::test_eq_41
  second_check: confirmed

- id: EQ-42
  section: 3
  page: 8
  kind: step
  says: Kinetic energy of the system.
