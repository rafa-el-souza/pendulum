  problem: Under \sum_k the speed is printed |\dot{\vec{R_n}}|^2, the speed of the last mass, for
    every k; the kinetic energy needs |\dot{\vec{R_k}}|^2. As printed it holds only for n = 1. (46.2)
    itself uses the corrected T.
  corrected: |-
    T=\sum_{k=1}^{n} \frac{1}{2}m_k|{\dot{\vec{R_k}}}|^{2}
  test: symbolic/test_sections_2_3.py::test_eq_42
