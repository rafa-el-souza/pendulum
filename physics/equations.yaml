- id: PH-9
  says: >-
    How the chain approaches the rope. With the rope's length and mass shared among N equal
    masses, each normal mode of the chain tends to the rope's as N grows, at first order in 1/N
    and from below. This holds mode by mode, not for all modes at once: at a given N the modes
    above about 1.6 times the square root of N are faster than the rope's. Against a rope
    longer by half a rod, L (1 + 1/(2N)), the agreement is of second order. Not in the paper.
  latex: |-
    \frac{\omega_k(N)}{\omega_k} = 1 - \frac{1}{4N} + O\!\left( N^{-2} \right)
    \qquad \text{for fixed } k \text{ as } N \to \infty
  rests_on: [EQ-66, EQ-74]
  tests:
