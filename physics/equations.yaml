- id: EQ-46.4
  section: 3
  page: 10
  kind: step
  says: Time derivative of the kinetic energy's velocity derivative, the part with different indices.
  status: misprint
  problem: 'The first sum carries an extra factor \dot{\theta_q}: l_il_q\dot{\theta_i}\dot{\theta_q}\sin(\theta_i-\theta_q)[\dot{\theta_q}-\dot{\theta_i}]
    should be l_il_q\dot{\theta_i}\sin(\theta_i-\theta_q)[\dot{\theta_q}-\dot{\theta_i}]. Read with
    its heading ''When i \neq j'' (the i = j terms of T left out), the second sum must also leave
    out i = q, which the paper itself does with \phi_{iq} in (46). Read with its inner sum as printed
    (all i, j = 1..k), the left side is d/dt(\partial T/\partial\dot{\theta_q}) and only the extra
    factor is wrong.'
  corrected: |-
    \frac{d}{dt}\big(\frac{\partial }{\partial{\dot{\theta_q}}}\Big(\sum_{k=1}^{n} \frac{1}{2}m_k\sum_{i,j=1,\,i\neq j}^{k} l_il_j\dot{\theta_i}\dot{\theta_j}\cos(\theta_i-\theta_j) \Big)\big) = \sum_{k=q}^{n} m_k\sum_{i=1}^{k} l_il_q\dot{\theta_i}\sin(\theta_i-\theta_q)[\dot{\theta_q}-\dot{\theta_i}] + \sum_{k=q}^{n} m_k\sum_{i=1}^{k} l_il_q\phi_{iq}\cos(\theta_i-\theta_q)\ddot{\theta_i}
  test: symbolic/test_sections_2_3.py::test_eq_46_4
  second_check: confirmed

- id: EQ-46
  section: 3
  page: 10
  kind: result
  says: General equation of motion for the q-th angle from the second derivation, as grouped double
    sums.
  status: misprint
  problem: The fourth sum carries the extra factor \dot{\theta_q} of (46.4). As printed (46) is the
    equation of motion only for n = 1, where the extra terms carry sin 0, and fails for every q when
    n = 2, 3, 4. Without the factor it equals the Euler-Lagrange expression exactly, and (38) term
    by term.
  corrected: |-
    g\sum_{i=q}^{n} m_il_q\sin(\theta_q) + \sum_{k=q}^{n} m_k\sum_{i=1}^{k} l_il_q\dot{\theta_i}\dot{\theta_q}\sin(\theta_q-\theta_i) +\sum_{k=q}^{n} m_k{l_q}^2\ddot{\theta_q} +\sum_{k=q}^{n} m_k\sum_{i=1}^{k} l_il_q\dot{\theta_i}\sin(\theta_i-\theta_q)[\dot{\theta_q}-\dot{\theta_i}] + \sum_{k=q}^{n} m_k\sum_{i=1}^{k} l_il_q\phi_{iq}\cos(\theta_i-\theta_q)\ddot{\theta_i}=0
  test: symbolic/test_sections_2_3.py::test_eq_46
  second_check: confirmed

- id: EQ-47
  section: 3
  page: 10
  kind: result
  says: The second derivation's equation of motion under a single outer sum.
  status: misprint
  problem: (47) is (46) regrouped (identical as printed), with the same extra factor \dot{\theta_q}
    in its fourth term.
  corrected: |-
    \sum_{k=q}^{n} \Big( gm_kl_q\sin(\theta_q) + m_k\sum_{i=1}^{k} l_il_q\dot{\theta_i}\dot{\theta_q}\sin(\theta_q-\theta_i) + m_k{l_q}^2\ddot{\theta_q} + m_k\sum_{i=1}^{k} l_il_q\dot{\theta_i}\sin(\theta_i-\theta_q)[\dot{\theta_q}-\dot{\theta_i}] + m_k\sum_{i=1}^{k} l_il_q\phi_{iq}\cos(\theta_i-\theta_q)\ddot{\theta_i} \Big)=0
  test: symbolic/test_sections_2_3.py::test_eq_47
  second_check: confirmed

