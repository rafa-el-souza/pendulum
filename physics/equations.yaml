- id: EQ-39
  section: 3
  page: 8
  kind: definition
  says: Position vector of the n-th mass as the sum of the rod vectors.
  status: misprint
  problem: The summand is printed \vec{r_n}, which does not depend on the summation index i, so the
    sum is n\vec{r_n}; the position of mass n is \sum_{i=1}^{n}\vec{r_i}. As printed it holds only
    for n = 1.
  corrected: |-
    \vec{R_n}=\sum_{i=1}^{n} \vec{r_i},\quad \vec{r_i}=l_i\sin(\theta_i)\hat{x}-l_i\cos(\theta_i)\hat{y}
  test: symbolic/test_sections_2_3.py::test_eq_39
  second_check: confirmed

