# The equations this project stands on, and what was checked about each.
#
# `equations` has one entry per display equation of the paper, by the number
# PRINTED in the PDF (the LaTeX source's labels look like numbers and are not).
# The paper itself is not reproduced: `says` describes the equation in our
# words, and LaTeX appears only where an entry corrects the print. To read the
# equations, rebuild the local reference copy (see physics/README.md).
#
#   id      EQ-<printed number>; EQ-sigma and EQ-phi are the two unnumbered
#           definitions.
#   page    the paper's own page number.
#   kind    definition | step | result | approximation.
#   status  ok        true as printed
#           misprint  not true as printed; `corrected` is
#           notation  true only under the reading given in `reading`
#           wrong     not true, and no small correction rescues it
#           unchecked no verdict
#   test    the test that decides the entry, under physics/oracle/. For a
#           misprint it asserts both that the printed form fails and that the
#           corrected form holds.
#   second_check
#           the verdict of a second reviewer who was given the claim without
#           the first reviewer's route: confirmed | confirmed with conditions |
#           disputed.
#
# `text` lists what is wrong or unsupported in the paper's prose and argument.
# `statements` is the physics the project relies on, in its own notation, each
# with the paper equations it rests on and the tests that establish it.
# Code and tests cite these ids.

