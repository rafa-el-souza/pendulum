text:
- id: TX-1
  where: Section 2, after (33), page 6.
  quote: appears in three equation
  says: >-
    The term named there, the third mass times its rod length squared times the third angular
    acceleration, appears only in (32). What the three equations share is its pattern: the
    masses at or below rod j, times the length of rod j squared, times the j-th angular
    acceleration, which is what (34) goes on to write.
  second_check: confirmed

- id: TX-2
  where: Section 2, the paragraph after (37), page 7.
  quote: it will appear in the same form as we formulated in eq.18
  says: >-
    The equation meant is (33). The number 18 is the name of that equation in the paper's
    source, not the number it is printed with; (18) is the Lagrangian of the double pendulum.
  second_check: confirmed

- id: TX-3
  where: Section 2, before (38), pages 7 and 8.
  quote: we can safely say that there will be no new terms for higher n values
  says: >-
    The step from three masses to any number is made by inspecting the pattern, not by proof.
    Its result is right: with the kinetic energy written as the quadratic form of PH-2, (38) is
    the Euler-Lagrange equation for every n, and it holds numerically from 1 to 256 masses
    (PH-3).
  tests:
  - symbolic/test_sections_2_3.py::test_eq_38
  - crosscheck/test_crosscheck.py::test_eq38_holds_for_the_constraint_force_accelerations
  second_check: confirmed

- id: TX-4
  where: Section 3, after (46), page 10.
  quote: When 46 is compared with 38, they are exactly the same except summation form.
  says: >-
    False as printed for two masses or more: (46) carries the extra angular velocity of (46.4),
    so the paper's two derivations do not agree on the page. True once (46) is corrected, term
    by term. The section also depends on the corrections of (39), (42) and (44): as printed,
    those give a kinetic energy that is not the system's, and the steps that follow, (46.2)
    and (46.3), use the right one without saying so.
  tests:
  - symbolic/test_sections_2_3.py::test_prose_46_and_38_are_the_same
  - crosscheck/test_crosscheck.py::test_eq47_as_printed_is_not_eq38
  - crosscheck/test_crosscheck.py::test_eq47_corrected_is_eq38
  second_check: confirmed

- id: TX-5
  where: Section 4, (50) to (53), page 11.
  says: >-
    The small-angle substitution is not consistent in order. The general line (51) keeps terms
    of third order in the angles and their rates, but lacks the third-order term of the sine in
    the gravity term, minus g l_j theta_j^3 / 6 times the masses at or below rod j. It is neither
    the linearization nor a consistent third-order approximation. The section's closing claim,
    that the result matches the usual small-angle equations, holds only for one mass, where the
    third-order terms that were kept cancel.
  tests:
  - limits/test_sections_4_5.py::test_section4_truncation_is_not_consistent_in_order
  second_check: confirmed

- id: TX-6
  where: Section 5, the fourth assumption, page 12.
  quote: The total length of the system is M
  says: M is the total mass.
  second_check: confirmed

- id: TX-7
  where: Section 5, the refinement of the chain, page 12.
  quote: inserting a new point mass between every two point mass
  says: >-
    Doubling the number of masses also takes a new mass between the pivot and the first one.
    Inserting only between masses gives 2n - 1.
  second_check: confirmed

- id: TX-8
  where: Section 5, after (60), page 13.
  quote: |-
    After some algebra, the coefficient of $\ddot{\theta}_k$'s will be 1.
  says: >-
    What becomes one is the coefficient of each displacement's acceleration in (61). The
    coefficient of the k-th angular acceleration in the sum is (n - k + 1) m l^2.
  second_check: confirmed

- id: TX-9
  where: Section 5, before (70), page 14.
  quote: |-
    $x_j$ and $x_{j-1}$ differ by $l/2^p$
  says: >-
    It is the positions of the two masses along the chain that differ by l/2^p. Their
    horizontal displacements differ by that length times the sine of the rod's angle.
  second_check: confirmed

- id: TX-10
  where: Section 5, (67) to (73), pages 14 and 15.
  quote: Fortunately, our limits happen to exist
  says: >-
    The limit argument shows consistency and nothing more: for a smooth field sampled at the
    masses, the right side of (66) differs from that of (74) by half of g l_p times the second
    derivative of the field along the rope, plus terms of second order in the spacing. That the
    chain's motion has such a field as its limit is asserted, not shown; (68) holds for any
    configuration at all and says nothing about derivatives.
  tests:
  - limits/test_sections_4_5.py::test_eq66_is_first_order_consistent_with_eq74
  second_check: confirmed

- id: TX-11
  where: Section 5, from (71) on.
  says: >-
    In this section y is the distance below the support, zero at the support and L at the free
    end: measured along the rope in (71) and (80), and as a vertical coordinate in (77) to
    (79), which agree to the order kept. The figures draw the y axis upwards, so the sign is
    the opposite of theirs.
  second_check: confirmed

- id: TX-12
  where: Section 5, after (80), page 16.
  quote: The integrand is the Lagrange Density
  says: >-
    With the factor one half outside the integral, the printed integrand is twice the density.
    The factor does not change (81).
  second_check: confirmed

- id: TX-13
  where: Section 5, after (81), page 16; also the abstract and the conclusion.
  quote: our system will start moving exactly as a hanging rope
  says: >-
    That (81) is (74) shows that the formal limit of the chain's equation is the rope's
    equation, not that the chain moves as the rope does. Its normal modes do converge to the
    rope's, one by one and at first order: a low mode of N masses is slower than the rope's by
    one part in 4N, while the modes above about 1.6 times the square root of N are faster
    (PH-9).
  tests:
  - limits/test_sections_4_5.py::test_frequency_convergence_to_the_rope
  - crosscheck/test_small_oscillations.py::test_a_low_mode_is_slower_than_the_rope_by_one_part_in_four_n
  - crosscheck/test_small_oscillations.py::test_the_high_modes_of_a_finite_chain_are_faster_than_the_rope
  second_check: confirmed with conditions

- id: TX-14
  where: Section 5, after (85), page 16.
  quote: one obtains the zeroth order Bessel's Equation
  says: >-
    With the paper's h alone, (85) becomes h^2 Psi'' + h Psi' + 4 K h^2 Psi = 0, which is
    Bessel's equation of order zero in the variable 2 sqrt(K) h and not in h. The paper gives
    neither the boundary conditions nor the frequencies; they are in PH-8.
  tests:
  - limits/test_sections_4_5.py::test_bessel_substitution_of_the_text
  second_check: confirmed

statements:
- id: PH-1
  says: >-
    Where the masses are. Each angle is measured from the downward vertical and is absolute,
    not relative to the rod above; x points right and y up, with the pivot at the origin.
  latex: |-
    x_i = \sum_{k=1}^{i} l_k \sin\theta_k, \qquad y_i = -\sum_{k=1}^{i} l_k \cos\theta_k
  rests_on: [EQ-3, EQ-4, EQ-5, EQ-6, EQ-23, EQ-39]
  tests:
  - symbolic/test_sections_2_3.py::test_eq_39
  - chain/test_chain.py::test_rod_lengths_have_zero_second_derivative
  second_check: confirmed

- id: PH-2
  says: >-
    The energies. The kinetic energy is a quadratic form in the angular velocities whose matrix
    A is the one of PH-3; the potential energy is zero at the height of the pivot.
  latex: |-
    T = \tfrac{1}{2} \sum_{i=1}^{n} m_i \left( \dot{x}_i^2 + \dot{y}_i^2 \right)
      = \tfrac{1}{2}\, \dot\theta^{\mathsf{T}} A(\theta)\, \dot\theta,
    \qquad
    U = -g \sum_{i=1}^{n} m_i \sum_{k=1}^{i} l_k \cos\theta_k
  rests_on: [EQ-41, EQ-42, EQ-43]
  tests:
  - symbolic/test_sections_2_3.py::test_eq_42
  - symbolic/test_sections_2_3.py::test_eq_43
  - symbolic/test_sections_2_3.py::test_oracle_compact_form
  - chain/test_chain.py::test_energy_sums_kinetic_and_potential_over_the_masses
  - chain/test_chain.py::test_energy_is_conserved_along_trajectories
  second_check: confirmed

- id: PH-3
  says: >-
    The equations of motion with the accelerations isolated. M_j is the total of the masses at
    or below rod j. The matrix A is symmetric and positive definite. This is the paper's (38)
    with its four groups of terms collected, and the same function of the state and of the
    accelerations.
  latex: |-
    \sum_{k=1}^{n} A_{jk}\, \ddot\theta_k
      + \sum_{k=1}^{n} M_{\max(j,k)}\, l_j l_k \sin(\theta_j - \theta_k)\, \dot\theta_k^2
      + g\, M_j\, l_j \sin\theta_j = 0,
    \qquad
    A_{jk} = M_{\max(j,k)}\, l_j l_k \cos(\theta_j - \theta_k),
    \qquad
    M_j = \sum_{i=j}^{n} m_i
  rests_on: [EQ-38, EQ-86, EQ-sigma, EQ-phi]
  tests:
  - symbolic/test_sections_2_3.py::test_eq_38
  - symbolic/test_sections_2_3.py::test_oracle_compact_form
  - crosscheck/test_crosscheck.py::test_eq38_is_the_compact_form
  - crosscheck/test_crosscheck.py::test_eq38_holds_to_fifty_digits
  - crosscheck/test_crosscheck.py::test_three_routes_give_the_same_accelerations
  second_check: confirmed

- id: PH-4
  says: >-
    The same motion from Newton's law, with the tension T_i of each rod as the unknown
    (positive when the rod pulls its ends together). The tensions solve a symmetric positive
    definite tridiagonal system, and the angular accelerations follow from them. Here 1/m_0 is
    zero, and so are T_0 and T_{n+1}. Not in the paper.
  latex: |-
    \left( \frac{1}{m_{i-1}} + \frac{1}{m_i} \right) T_i
      - \frac{\cos(\theta_i - \theta_{i-1})}{m_{i-1}}\, T_{i-1}
      - \frac{\cos(\theta_{i+1} - \theta_i)}{m_i}\, T_{i+1}
      = l_i\, \dot\theta_i^2 + \delta_{i1}\, g \cos\theta_1,
    \qquad
    l_i\, \ddot\theta_i
      = \frac{\sin(\theta_{i+1} - \theta_i)}{m_i}\, T_{i+1}
      - \frac{\sin(\theta_i - \theta_{i-1})}{m_{i-1}}\, T_{i-1}
      - \delta_{i1}\, g \sin\theta_1
  rests_on: []
  tests:
  - chain/test_chain.py::test_matches_dense_kkt_solve
  - chain/test_chain.py::test_newton_law_holds_for_every_mass
  - chain/test_chain.py::test_matches_arbitrary_precision_on_random_states
  - crosscheck/test_crosscheck.py::test_eq38_holds_for_the_constraint_force_accelerations
  second_check: confirmed

- id: PH-5
  says: >-
    A chain with every rod on one line through the pivot, straight or folded back on itself,
    accelerates like a simple pendulum at its first angle and not at all at the others,
    whatever the angular velocities. An exact case for any number of masses, which any correct
    equation of motion must reproduce. Not in the paper.
  latex: |-
    \theta_k \in \{ \theta_1,\ \theta_1 + \pi \}\ \text{for every } k
    \quad\Longrightarrow\quad
    \ddot\theta_1 = -\frac{g}{l_1} \sin\theta_1, \qquad \ddot\theta_k = 0 \ \ (k \ge 2)
  rests_on: []
  tests:
  - chain/test_chain.py::test_collinear_chain_closed_form
  - crosscheck/test_crosscheck.py::test_eq38_on_a_collinear_chain
  - crosscheck/test_crosscheck.py::test_eq38_on_a_collinear_chain_to_fifty_digits
  second_check: confirmed

- id: PH-6
  says: >-
    Small oscillations about the hanging rest state, for any masses and lengths: the
    consistent linearization of PH-3. It is the paper's (54).
  latex: |-
    \sum_{k=1}^{n} M_{\max(j,k)}\, l_j l_k\, \ddot\theta_k + g\, M_j\, l_j\, \theta_j = 0
  rests_on: [EQ-54]
  tests:
  - limits/test_sections_4_5.py::test_eq54_is_the_first_principles_linearization
  - crosscheck/test_small_oscillations.py::test_two_equal_masses_are_the_textbook_double_pendulum
  second_check: confirmed

- id: PH-7
  says: >-
    Small oscillations of N equal masses m on equal rods l, in the horizontal displacements
    x_j, with x_0 = 0. The squared frequencies, in units of g/l, are the zeros of the Laguerre
    polynomial of degree N. The difference equation is the paper's (65); the Laguerre zeros are
    not in the paper.
  latex: |-
    \ddot{x}_j = \frac{g}{l} \left[ (N - j)\,(x_{j+1} - x_j) - (N - j + 1)\,(x_j - x_{j-1}) \right],
    \qquad
    L_N\!\left( \frac{\omega_k^2\, l}{g} \right) = 0
  rests_on: [EQ-65, EQ-66]
  tests:
  - limits/test_sections_4_5.py::test_eq65_is_the_first_principles_equation
  - limits/test_sections_4_5.py::test_laguerre_structure_of_the_equal_chain
  - crosscheck/test_small_oscillations.py::test_frequencies_are_the_zeros_of_a_laguerre_polynomial
  second_check: confirmed

- id: PH-8
  says: >-
    The hanging rope of length L and uniform density: the equation of its small transverse
    motion, its normal modes and their frequencies. Here y is the distance below the support,
    j_{0,k} is the k-th zero of the Bessel function J_0, the shape vanishes at the support and
    stays bounded at the free end. The frequencies do not depend on the density. The paper
    gives the equation, as (74) and (81), and not its solution.
  latex: |-
    \frac{\partial^2 x}{\partial t^2}
      = g\, \frac{\partial}{\partial y} \left[ (L - y)\, \frac{\partial x}{\partial y} \right],
    \qquad
    \Psi_k(y) = J_0\!\left( j_{0,k} \sqrt{1 - y/L} \right),
    \qquad
    \omega_k = \frac{j_{0,k}}{2} \sqrt{\frac{g}{L}}
  rests_on: [EQ-74, EQ-81, EQ-85]
  tests:
