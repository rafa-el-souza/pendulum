  status: misprint
  problem: 'The third term is printed with the dot over the whole group, \dot{\theta_1^2}: read literally,
    the time derivative of theta_1^2, which is 2 theta_1 \dot{\theta_1} and does not cancel the fourth
    term. With \dot{\theta_1}^2 the line is exactly (51) for n = 2, j = 1. The text announces j =
