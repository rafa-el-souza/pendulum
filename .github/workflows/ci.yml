# Checks for every pull request and for main: the oracle's lint and tests, the
# web app's checks with every page opened in three browser engines, and a
# secret scan of every commit. CI holds no secret and deploys nothing. The
# workflows themselves are linted by the pre-commit hook, with actionlint.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oracle:
    name: "Oracle: lint and tests"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: physics/oracle
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          working-directory: physics/oracle

      # The Python version comes from physics/oracle/.python-version, and every
      # package from the lock file, which must match pyproject.toml.
      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Formatting
        run: uv run --locked ruff format --check

      - name: Tests (every display equation of the paper, and the second route)
        run: uv run --locked pytest

  web:
    name: "Web: types, lint, unit tests, build and three browsers"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No install scripts run (web/.npmrc).
      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      # Their system packages include Xvfb, the virtual display below.
      - name: Install Chromium, Firefox and WebKit
        run: npm run e2e:browsers

      # Firefox runs headed here, on the virtual display, to get WebGL2
      # (web/playwright.config.ts); Chromium and WebKit stay headless.
      - name: Every page in the three engines
        run: xvfb-run --auto-servernum npm run e2e

  secret_scan:
    name: "Secrets: gitleaks"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the whole history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks, checksum pinned
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
